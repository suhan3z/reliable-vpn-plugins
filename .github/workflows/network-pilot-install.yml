name: Owned VPN pilot native installation
on:
  push:
    branches: [codex/network-pilot-connectivity]
jobs:
  native-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: rvpn-pilot-01a1342a
    permissions:
      contents: write # GitHub requires push access to read unpublished draft assets.
    steps:
      - name: Download private acceptance candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 assets source receipts
          gh release download network-v2-0.2.0 --repo suhan3z/reliable-vpn-plugins --dir assets \
            --pattern root.pub --pattern release-assets-v2.json --pattern network-plugins-v2.json \
            --pattern network-host.json --pattern network-control.json \
            --pattern network-host-0.7.0-linux-x86_64 --pattern network-control-0.7.0-linux-x86_64 \
            --pattern network-suite-0.2.0-linux-x86_64.rvnp \
            --pattern client-native-linux-x86_64.so --pattern client-matching-source.tar.gz
      - name: Verify candidate before extracting or executing
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,tarfile
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          root='QgsX33BwqzdoA5s8IOKd8n5/bxczmzL2gBX8JowgQ5k='
          directory=pathlib.Path('assets')
          assert (directory/'root.pub').read_text().strip()==root
          envelope=json.loads((directory/'release-assets-v2.json').read_bytes())
          payload=base64.b64decode(envelope['payload'],validate=True)
          Ed25519PublicKey.from_public_bytes(base64.b64decode(root)).verify(base64.b64decode(envelope['signature'],validate=True),b'rvpn-release-assets-v2\0'+payload)
          manifest=json.loads(payload);assert manifest['generation']==2026101405
          files={file['name']:file for file in manifest['files']}
          for path in directory.iterdir():
              if path.name=='release-assets-v2.json':continue
              expected=files[path.name]
              assert path.stat().st_size==expected['size'] and hashlib.sha256(path.read_bytes()).hexdigest()==expected['sha256']
          with tarfile.open(directory/'client-matching-source.tar.gz') as archive:
              archive.extractall('source',filter='data')
          print('Pinned signatures and all downloaded asset hashes verified.')
          PY
      - name: Install and verify only the owned pilot
        env:
          RVPN_PILOT_INSTALL_SECRET: ${{ secrets.RVPN_PILOT_INSTALL_SECRET }}
          RVPN_TEST_EXPORT_KEY: ${{ secrets.RVPN_TEST_EXPORT_KEY }}
        run: |
          python3 source/client/ops/personal/pilot-ci.py \
            --release "$PWD/assets" --source "$PWD/source/client" --output "$PWD/receipts"
      - name: Preserve safe evidence and encrypted recipient profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-pilot-linux-1405-${{ github.run_id }}
          path: |
            receipts/linux-pilot-receipt.json
            receipts/recipient-profile.aesgcm
          if-no-files-found: ignore
          retention-days: 7
