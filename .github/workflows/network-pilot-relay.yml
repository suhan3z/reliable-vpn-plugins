name: Temporary isolated pilot uplink
on:
  push:
    branches: [codex/network-pilot-relay]
jobs:
  scoped-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    environment: rvpn-pilot-01a1342a
    permissions:
      contents: read
    steps:
      - name: Verify pinned upstream binaries
        run: |
          mkdir -m 700 private receipts
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz -o private/box.tar.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  private/box.tar.gz' | sha256sum -c -
          tar -xf private/box.tar.gz -C private
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 -o private/cloudflared
          echo 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  private/cloudflared' | sha256sum -c -
          chmod 700 private/cloudflared
          python3 -m pip install --quiet cryptography
      - name: Start temporary authenticated relay with fixed destination scope
        env:
          RVPN_TEST_EXPORT_KEY: ${{ secrets.RVPN_TEST_EXPORT_KEY }}
        shell: python
        run: |
          import base64,json,os,pathlib,re,secrets,subprocess,time,uuid
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          assert os.environ['GITHUB_REF']=='refs/heads/codex/network-pilot-relay'
          private=pathlib.Path('private');user=str(uuid.uuid4());path='/'+secrets.token_hex(32)
          config={'log':{'disabled':True},'inbounds':[{'type':'vless','listen':'127.0.0.1','listen_port':18080,'users':[{'uuid':user}],'transport':{'type':'ws','path':path}}],'outbounds':[{'type':'direct','tag':'direct'}],'route':{'rules':[{'ip_cidr':['147.45.166.68/32'],'action':'route','outbound':'direct'},{'domain':['api.timeweb.cloud','github.com'],'action':'route','outbound':'direct'},{'domain_suffix':['githubusercontent.com'],'action':'route','outbound':'direct'},{'action':'reject'}]}}
          file=private/'server.json';file.write_text(json.dumps(config));file.chmod(0o600)
          binary=private/'sing-box-1.14.3-linux-amd64/sing-box'
          subprocess.run([str(binary),'check','-c',str(file)],check=True)
          server=subprocess.Popen([str(binary),'run','-c',str(file)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
          log=private/'cloud.log'
          with log.open('w') as output:
              tunnel=subprocess.Popen([str(private/'cloudflared'),'tunnel','--no-autoupdate','--url','http://127.0.0.1:18080'],stdout=output,stderr=output,start_new_session=True)
          url=None
          for _ in range(60):
              if server.poll() is not None or tunnel.poll() is not None:raise SystemExit('relay_process_failed')
              match=re.search(r'https://[a-z0-9-]+\.trycloudflare\.com',log.read_text())
              if match:url=match.group(0);break
              time.sleep(1)
          if not url:raise SystemExit('relay_url_missing')
          data=json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'url':url,'uuid':user,'path':path,'scope':'owned pilot 9338065 and authenticated hosting API/public signed distribution only','server_pid':server.pid,'tunnel_pid':tunnel.pid}).encode()
          key=base64.b64decode(os.environ.pop('RVPN_TEST_EXPORT_KEY'),validate=True);nonce=os.urandom(12)
          pathlib.Path('receipts/relay.aesgcm').write_bytes(nonce+AESGCM(key).encrypt(nonce,data,b'rvpn-pilot-relay-01a1342a'))
          pathlib.Path('private/pids.json').write_text(json.dumps([server.pid,tunnel.pid]))
          print('Temporary relay ready; no hosting credentials, SSH keys or master profile exported.')
      - name: Preserve only encrypted connection settings
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-pilot-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/relay.aesgcm
          retention-days: 1
      - name: Keep temporary uplink available for local isolated acceptance
        shell: python
        run: |
          import json,os,pathlib,time
          processes=json.loads(pathlib.Path('private/pids.json').read_text())
          for _ in range(1440):
              for pid in processes:os.kill(pid,0)
              time.sleep(5)
